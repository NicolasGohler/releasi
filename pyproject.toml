[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "releasi"
version = "0.1.0"
description = "LinkedIn automation tool for connection requests and follow-up messaging"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "typer[all]>=0.9",
    "structlog>=23.2",
    "python-dateutil>=2.8",
    "playwright-stealth>=2.0.2",
    "httpx>=0.25",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.4",
    "factory-boy>=3.3",
    "coverage>=7.3",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.25",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",
]
fundraising = [
    "beautifulsoup4>=4.14",
    "pandas>=2.0",
    "slack-sdk>=3.0",
    "requests>=2.32",
]

[project.scripts]
releasi = "releasi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
